<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hrGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="hrFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isometric Ground Base -->
  <g transform="translate(250, 250)">
    <ellipse cx="0" cy="40" rx="190" ry="70" fill="url(#hrGlow)" filter="url(#hrFilter)" opacity="0.35"/>
    <path d="M-150,40 L0,-35 L150,40 L0,115 Z" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- 3D Bar Columns (Payroll / Attendance Metrics) -->
  <g transform="translate(250, 220)">
    <!-- Bar 1 (Left) -->
    <g transform="translate(-80, 0)">
      <polygon points="-15,0 0,8 15,0 0,-8" fill="#a78bfa"/>
      <polygon points="-15,0 0,8 0,60 -15,52" fill="url(#bar1)"/>
      <polygon points="0,8 15,0 15,52 0,60" fill="#5b21b6"/>
    </g>
    <!-- Bar 2 (Center - Tallest) -->
    <g transform="translate(0, -30)">
      <polygon points="-18,0 0,10 18,0 0,-10" fill="#7dd3fc"/>
      <polygon points="-18,0 0,10 0,90 -18,80" fill="url(#bar2)"/>
      <polygon points="0,10 18,0 18,80 0,90" fill="#0369a1"/>
    </g>
    <!-- Bar 3 (Right) -->
    <g transform="translate(80, 15)">
      <polygon points="-15,0 0,8 15,0 0,-8" fill="#6ee7b7"/>
      <polygon points="-15,0 0,8 0,45 -15,37" fill="url(#bar3)"/>
      <polygon points="0,8 15,0 15,37 0,45" fill="#047857"/>
    </g>
  </g>

  <!-- Central Floating 3D User Hologram Badge -->
  <g transform="translate(250, 120)" filter="url(#hrFilter)">
    <!-- Glowing Hexagon / Card -->
    <polygon points="0,-40 38,-18 38,25 0,48 -38,25 -38,-18" fill="#1e1b4b" stroke="#a855f7" stroke-width="2.5"/>
    <!-- User Avatar Icon -->
    <circle cx="0" cy="-6" r="14" fill="#38bdf8"/>
    <path d="M-18,24 C-18,12 18,12 18,24 Z" fill="#818cf8"/>
  </g>

  <!-- Floating Team Nodes (Left & Right) -->
  <g transform="translate(130, 100)" filter="url(#hrFilter)">
    <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="-4" r="8" fill="#38bdf8"/>
    <path d="M-10,12 C-10,6 10,6 10,12 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(370, 110)" filter="url(#hrFilter)">
    <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <circle cx="0" cy="-4" r="8" fill="#10b981"/>
    <path d="M-10,12 C-10,6 10,6 10,12 Z" fill="#10b981"/>
  </g>

  <!-- Connecting Holographic Data Rays -->
  <line x1="152" y1="105" x2="212" y2="120" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="288" y1="120" x2="348" y2="112" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4,3"/>

  <!-- Biometric Scanner Symbol (Base) -->
  <g transform="translate(250, 315)">
    <ellipse cx="0" cy="0" rx="35" ry="14" fill="none" stroke="#a855f7" stroke-width="2" filter="url(#hrFilter)"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#a855f7"/>
  </g>
</svg>