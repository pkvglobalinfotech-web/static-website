<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hospGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0066cc" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="wallFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wallSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="roofTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isometric Ground Plane Grid -->
  <g transform="translate(250, 240)">
    <!-- Base Ellipse Shadow -->
    <ellipse cx="0" cy="50" rx="180" ry="70" fill="url(#hospGlow)" filter="url(#glowEffect)" opacity="0.4"/>
    <!-- Isometric Grid Lines -->
    <path d="M-140,50 L0,-20 L140,50 L0,120 Z" fill="#0f172a" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="M-70,15 L70,85 M70,15 L-70,85 M0,-20 L0,120 M-140,50 L140,50" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.15"/>
  </g>

  <!-- 3D Hospital Main Building -->
  <g transform="translate(250, 190)">
    <!-- Main Tower Left Face -->
    <polygon points="-80,-40 0,0 0,100 -80,60" fill="url(#wallFront)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Main Tower Right Face -->
    <polygon points="0,0 80,-40 80,60 0,100" fill="url(#wallSide)" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.3"/>
    <!-- Main Tower Roof -->
    <polygon points="-80,-40 0,-80 80,-40 0,0" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>

    <!-- Windows Left (Grid) -->
    <g fill="#38bdf8" opacity="0.8">
      <polygon points="-65,-15 -50,-22 -50,-10 -65,-3" />
      <polygon points="-40,-5 -25,-12 -25,0 -40,7" />
      <polygon points="-15,5 0,-2 0,10 -15,17" />
      <polygon points="-65,15 -50,8 -50,20 -65,27" />
      <polygon points="-40,25 -25,18 -25,30 -40,37" />
      <polygon points="-15,35 0,28 0,40 -15,47" />
    </g>

    <!-- Windows Right -->
    <g fill="#0284c7" opacity="0.7">
      <polygon points="15,5 30,-2 30,10 15,17" />
      <polygon points="40,-5 55,-12 55,0 40,7" />
      <polygon points="15,35 30,28 30,40 15,47" />
      <polygon points="40,25 55,18 55,30 40,37" />
    </g>

    <!-- Hospital 3D Red Cross on Roof -->
    <g transform="translate(0, -60)" filter="url(#glowEffect)">
      <polygon points="-12,-15 12,-15 12,15 -12,15" fill="url(#crossGrad)"/>
      <polygon points="-25,-4 25,-4 25,4 -25,4" fill="url(#crossGrad)"/>
    </g>

    <!-- Rooftop Helipad Circle -->
    <ellipse cx="0" cy="-40" rx="24" ry="12" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="0" y="-36" font-family="sans-serif" font-weight="900" font-size="12" fill="#facc15" text-anchor="middle">H</text>
  </g>

  <!-- Floating 3D Clinical / EMR Holographic Tablet -->
  <g transform="translate(130, 160)">
    <!-- Tablet Body -->
    <polygon points="-45,-20 35,-60 55,-40 -25,0" fill="#0f172a" stroke="#00d4ff" stroke-width="2" opacity="0.95" filter="url(#glowEffect)"/>
    <!-- Screen Surface -->
    <polygon points="-40,-20 30,-55 48,-38 -22,-3" fill="#0369a1" opacity="0.8"/>
    <!-- ECG Heartbeat Wave -->
    <path d="M-30,-12 L-15,-20 L-8,-32 L0,-8 L8,-22 L20,-16 L38,-42" fill="none" stroke="#34d399" stroke-width="2.5" filter="url(#glowEffect)"/>
  </g>

  <!-- Floating 3D Pharmacy Capsule -->
  <g transform="translate(370, 180)" filter="url(#glowEffect)">
    <!-- Capsule Left (Blue) -->
    <path d="M-20,-10 C-30,-20 -15,-35 -5,-25 L10,-10 L-5,5 Z" fill="#3b82f6"/>
    <!-- Capsule Right (White) -->
    <path d="M10,-10 L25,5 C35,15 20,30 10,20 L-5,5 Z" fill="#f8fafc"/>
  </g>

  <!-- Stethoscope / Medical Pulse Line Accent -->
  <path d="M80,310 Q250,350 420,300" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="250" cy="330" r="4" fill="#34d399" filter="url(#glowEffect)"/>
</svg>