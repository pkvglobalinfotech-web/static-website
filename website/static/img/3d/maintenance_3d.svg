<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="maintGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="maintFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ground Plane Shadow -->
  <g transform="translate(250, 260)">
    <ellipse cx="0" cy="40" rx="190" ry="70" fill="url(#maintGlow)" filter="url(#maintFilter)" opacity="0.35"/>
    <path d="M-150,35 L0,-40 L150,35 L0,110 Z" fill="#0b1720" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- 3D Isometric Security Shield (Center) -->
  <g transform="translate(250, 160)" filter="url(#maintFilter)">
    <!-- 3D Extrusion / Shield Depth -->
    <path d="M-55,-60 L0,-85 L55,-60 C55,20 0,65 0,65 C0,65 -55,20 -55,-60 Z" fill="#022c22"/>
    <!-- Shield Front Face -->
    <path d="M-50,-65 L0,-90 L50,-65 C50,15 0,60 0,60 C0,60 -50,15 -50,-65 Z" fill="url(#shieldGrad)" stroke="#34d399" stroke-width="2.5"/>
    <!-- Glowing Padlock Symbol -->
    <g transform="translate(0, -10)">
      <rect x="-16" y="-6" width="32" height="24" rx="4" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
      <path d="M-10,-6 L-10,-18 C-10,-24 10,-24 10,-18 L10,-6" fill="none" stroke="#facc15" stroke-width="3"/>
      <circle cx="0" cy="4" r="3" fill="#facc15"/>
    </g>
  </g>

  <!-- 3D Interlocking Mechanical Gears (Left) -->
  <g transform="translate(130, 180)" filter="url(#maintFilter)">
    <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Gear Teeth -->
    <line x1="0" y1="-34" x2="0" y2="-28" stroke="#38bdf8" stroke-width="6"/>
    <line x1="0" y1="28" x2="0" y2="34" stroke="#38bdf8" stroke-width="6"/>
    <line x1="-34" y1="0" x2="-28" y2="0" stroke="#38bdf8" stroke-width="6"/>
    <line x1="28" y1="0" x2="34" y2="0" stroke="#38bdf8" stroke-width="6"/>
  </g>

  <!-- 3D Server Uptime Speedometer / Gauge (Right) -->
  <g transform="translate(370, 170)" filter="url(#maintFilter)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <path d="M-22,12 A26,26 0 1,1 22,12" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="16" y2="-12" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#fff"/>
    <text x="0" y="24" font-family="sans-serif" font-weight="bold" font-size="9" fill="#10b981" text-anchor="middle">99.9%</text>
  </g>

  <!-- Pulse Status Radar -->
  <circle cx="250" cy="275" r="45" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <circle cx="250" cy="275" r="5" fill="#34d399"/>
</svg>